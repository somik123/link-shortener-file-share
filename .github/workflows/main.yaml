name: Docker Image Build
on: push

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code from github repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run complete test suite
        run: mvn --batch-mode --no-transfer-progress clean test
        env:
          SHORTURL_PASS_HIDE: 'yes'
          SITE_FULL_URL: https://example.invalid/
          TELEGRAM_APIKEY: '000000000000000000000000'
          TELEGRAM_ADMINID: '42'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: somik123/shorturl-fileshare:latest
