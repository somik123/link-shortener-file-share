<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<body>
    <div class="admin-section-heading">
        <div>
            <h3>Short links</h3>
            <p>Manage destinations and view activity.</p>
        </div>
        <span class="record-count" th:text="${max >= 0 ? max + 1 : 0} + ' on this page'">0 on this page</span>
    </div>
    <p class="empty-state" th:if="${max < 0}">No short links yet.</p>
    <div class="record-list" th:if="${max >= 0}">
        <article class="record-card" th:each="i : ${#numbers.sequence(0, max)}">
            <div class="record-header">
                <div class="record-heading">
                    <span class="record-index" th:text="'#' + ${startIndex+i+1}">#1</span>
                    <a class="record-title" th:href="'/' + ${surlList.get(i).surl}" target="_blank"
                        rel="noopener noreferrer" th:text="${surlList.get(i).surl}">short-id</a>
                </div>
                <div class="record-actions">
                    <a th:href="'/admin/enableDisable/surl/' + ${surlList.get(i).surl}"
                        th:class="${surlList.get(i).isEnabled} ? 'status-badge enabled' : 'status-badge disabled'"
                        th:text="${surlList.get(i).isEnabled} ? 'Disable' : 'Enable'"
                        th:aria-label="${surlList.get(i).isEnabled} ? 'Disable link' : 'Enable link'"></a>
                    <button type="button" class="action-icon-btn action-info" th:data-surl="${surlList.get(i).surl}"
                        onclick="return admin_get_logs(this.getAttribute('data-surl'));" title="View logs"
                        aria-label="View logs"><i class="bi bi-list-ul"></i></button>
                    <button type="button" class="action-icon-btn action-danger"
                        th:data-deleteUrl="'/delete/' + ${surlList.get(i).surl} + '/' + ${surlList.get(i).deleteKey}"
                        onclick="return admin_delete(this.getAttribute('data-deleteUrl'));" title="Delete link"
                        aria-label="Delete link"><i class="bi bi-trash3"></i></button>
                </div>
            </div>
            <div class="record-destination">
                <span class="record-label">Original URL</span>
                <span class="record-value" th:text="${surlList.get(i).longUrl}">https://example.com</span>
            </div>
            <dl class="record-meta">
                <div><dt>Created</dt><dd th:text="${#strings.replace(surlList.get(i).created, 'T',' ')}">Date</dd></div>
                <div><dt>Creator IP</dt><dd th:text="${surlList.get(i).creatorIp}">IP</dd></div>
                <div><dt>Clicks</dt><dd th:text="${surlList.get(i).hits}">0</dd></div>
            </dl>
        </article>
    </div>
    <div th:replace="~{layout::adminPagination}"></div>
</body>

</html>
