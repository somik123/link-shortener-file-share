<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<body>
    <div class="admin-section-heading">
        <div>
            <h3 th:text="'Activity for ' + ${name}">Activity</h3>
            <p>Recent visits and downloads.</p>
        </div>
    </div>
    <p class="empty-state" th:if="${max < 0}">No activity yet.</p>
    <div class="record-list" th:if="${max >= 0}">
        <article class="record-card" th:each="i : ${#numbers.sequence(0, max)}">
            <div class="record-header">
                <span class="record-index" th:text="'#' + ${i+1}">#1</span>
                <time th:text="${#strings.replace(logs.get(i).hitTime, 'T',' ')}">Date</time>
            </div>
            <dl class="record-meta">
                <div><dt>IP address</dt><dd th:text="${logs.get(i).hitIp}">IP</dd></div>
                <div><dt>Browser</dt><dd th:text="${logs.get(i).browserHeaders}">Browser</dd></div>
            </dl>
        </article>
    </div>
</body>

</html>
