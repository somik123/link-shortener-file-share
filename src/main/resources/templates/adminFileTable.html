<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<body>
    <div class="admin-section-heading">
        <div>
            <h3>Shared files</h3>
            <p>Manage uploads and expiry dates.</p>
        </div>
        <span class="record-count" th:text="${max >= 0 ? max + 1 : 0} + ' on this page'">0 on this page</span>
    </div>
    <p class="empty-state" th:if="${max < 0}">No shared files yet.</p>
    <div class="record-list" th:if="${max >= 0}">
        <article class="record-card" th:each="i : ${#numbers.sequence(0, max)}">
            <div class="record-header">
                <div class="record-heading">
                    <span class="record-index" th:text="'#' + ${startIndex+i+1}">#1</span>
                    <a class="record-title" th:href="${fileList.get(i).url}" target="_blank"
                        rel="noopener noreferrer" th:text="${fileList.get(i).name}">File name</a>
                </div>
                <div class="record-actions">
                    <a th:href="'/admin/enableDisable/file/' + ${fileList.get(i).downloadKey}"
                        th:class="${fileList.get(i).active} ? 'status-badge enabled' : 'status-badge disabled'"
                        th:text="${fileList.get(i).active} ? 'Disable' : 'Enable'"
                        th:aria-label="${fileList.get(i).active} ? 'Disable file' : 'Enable file'"></a>
                    <button type="button" class="action-icon-btn action-info"
                        th:data-downloadKey="${fileList.get(i).downloadKey}"
                        onclick="return admin_get_file_logs(this.getAttribute('data-downloadKey'));"
                        title="View logs" aria-label="View logs"><i class="bi bi-list-ul"></i></button>
                    <button type="button" class="action-icon-btn action-danger"
                        th:data-deleteUrl="${fileList.get(i).deleteUrl}"
                        onclick="return admin_delete(this.getAttribute('data-deleteUrl'));"
                        title="Delete file" aria-label="Delete file"><i class="bi bi-trash3"></i></button>
                </div>
            </div>
            <dl class="record-meta">
                <div><dt>Size</dt><dd th:text="${fileList.get(i).size}">123 KB</dd></div>
                <div><dt>Type</dt><dd th:text="${fileList.get(i).mimeType}">image/jpeg</dd></div>
                <div><dt>Downloads</dt><dd th:text="${fileList.get(i).hits}">0</dd></div>
                <div><dt>Created</dt><dd th:text="${#strings.replace(fileList.get(i).created, 'T',' ')}">Date</dd></div>
                <div><dt>Expires</dt><dd th:text="${#strings.replace(fileList.get(i).expiryTime, 'T',' ')}">Date</dd></div>
                <div><dt>Creator IP</dt><dd th:text="${fileList.get(i).creatorIp}">IP</dd></div>
            </dl>
        </article>
    </div>
    <div th:replace="~{layout::adminPagination}"></div>
</body>

</html>
